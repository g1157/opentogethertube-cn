[default]
locale = "en-us"

extend-ignore-re = [
	# Review docs cite commits by short hash (`020ba72`), and a hex run that happens to
	# spell a word is not a typo. Ignoring the quoted form keeps the word list honest —
	# listing that fragment in extend-words would hide a real misspelling everywhere else.
	"`[0-9a-f]{7,40}`",
]

[default.extend-words]
guage = "gauge"
AVOD = "AVOD"
ser = "ser"
seeked = "seeked"
# GLSL's storage qualifier, used by the EASU port in client/src/util/upscale/cas.ts
inout = "inout"
# google drive misspelled this in their API
aknowledge = "aknowledge"
# Odysee
Ody = "Ody"
# The Discord music bot the voice docs cite by name
Rythm = "Rythm"

[type.css]
extend-glob = ["*.css"]
# CSS unicode-range values contain hexadecimal code points.
extend-ignore-re = ["\\b[Uu]\\+[0-9A-Fa-f]{1,6}(?:-[0-9A-Fa-f]{1,6})?\\b"]

[files]
extend-exclude = [
	"server/tests/unit/fixtures",
	"server/tests/unit/services/youtube.spec.ts",
	"client/src/locales",
	"!client/src/locales/en.ts",
	"deploy/nginx.prod.conf",
]
